name: Restrict merge to dev

on:
  pull_request:
    branches:
      - dev

jobs:
  check-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        run: |
          echo "Source branch is ${{ github.head_ref }}"

          if [[ "${{ github.head_ref }}" != "feature_subdomain" ]]; then
            echo "ERROR: Only 'feature_subdomain' branch can merge into dev"
            exit 1
          fi